name: gh_todos
description: 'A simple todo app built around GitHub Projects.'
publish_to: 'none'
version: 1.2.0

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  mix: ^2.1.0
  lucide_icons_flutter: ^3.1.14+2
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  graphql: ^5.2.4
  graphql_flutter: ^5.3.0
  hive_ce: ^2.19.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.2.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.3
  timeago: ^3.7.1
  flutter_slidable: ^4.0.3
  logging: ^1.3.0
  talker_flutter: ^5.1.20
  talker_riverpod_logger: ^5.1.20
  markdown: ^7.3.0
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  flutter_html_svg: ^3.0.0

dependency_overrides:
  # flutter_html 3.0.0 calls an API removed in html 0.15.7.
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  graphql_codegen: ^3.0.1
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  json_serializable: ^6.14.0
  freezed: ^4.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - CHANGELOG.md
