query ProjectAssignedIssues($projectId: ID!, $afterCursor: String) {
  node(id: $projectId) {
    ... on ProjectV2 {
      items(first: 100, after: $afterCursor, query: "assignee:@me is:open") {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          id
          fieldValues(first: 15) {
            nodes {
              __typename
              ... on ProjectV2ItemFieldSingleSelectValue {
                name
                field {
                  ... on ProjectV2SingleSelectField {
                    name
                  }
                }
              }
              ... on ProjectV2ItemFieldDateValue {
                date
                field {
                  ... on ProjectV2Field {
                    name
                  }
                }
              }
            }
          }
          content {
            __typename
            ... on Issue {
              id
              number
              title
              bodyText
              state
              url
              createdAt
              updatedAt
              closedAt
              labels(first: 10) {
                nodes {
                  name
                  color
                }
              }
              comments(first: 100) {
                totalCount
                nodes {
                  author {
                    login
                  }
                  bodyText
                }
              }
            }
          }
        }
      }
    }
  }
}
