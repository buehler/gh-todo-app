query ProjectAssignedIssues($projectId: ID!) {
  open: node(id: $projectId) {
    ... on ProjectV2 {
      items(first: 100, query: "assignee:@me is:open") {
        nodes {
          ...ProjectItemFields
        }
      }
    }
  }
  recentlyClosed: node(id: $projectId) {
    ... on ProjectV2 {
      items(first: 100, query: "assignee:@me is:closed updated:>@today-3d") {
        nodes {
          ...ProjectItemFields
        }
      }
    }
  }
}

fragment ProjectItemFields on ProjectV2Item {
  id
  fieldValues(first: 15) {
    nodes {
      __typename
      ... on ProjectV2ItemFieldSingleSelectValue {
        optionId
        name
        field {
          ... on ProjectV2SingleSelectField {
            id
            name
          }
        }
      }
      ... on ProjectV2ItemFieldDateValue {
        date
        field {
          ... on ProjectV2Field {
            id
            name
          }
        }
      }
    }
  }
  content {
    __typename
    ... on Issue {
      id
      number
      title
      createdAt
      updatedAt
      closedAt
      comments(first: 0) {
        totalCount
      }
    }
  }
}
