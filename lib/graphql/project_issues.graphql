query ProjectAssignedIssues($projectId: ID!, $afterOpen: String, $afterRecentlyClosed: String) {
  open: node(id: $projectId) {
    ... on ProjectV2 {
      items(first: 100, after: $afterOpen, query: "assignee:@me is:open") {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ProjectItemFields
        }
      }
    }
  }
  recentlyClosed: node(id: $projectId) {
    ... on ProjectV2 {
      items(first: 100, after: $afterRecentlyClosed, query: "assignee:@me is:closed updated:>@today-3d") {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ProjectItemFields
        }
      }
    }
  }
}

fragment ProjectItemFields on ProjectV2Item {
  id
  fieldValues(first: 15) {
    nodes {
      __typename
      ... on ProjectV2ItemFieldSingleSelectValue {
        optionId
        name
        field {
          ... on ProjectV2SingleSelectField {
            id
            name
          }
        }
      }
      ... on ProjectV2ItemFieldDateValue {
        date
        field {
          ... on ProjectV2Field {
            id
            name
          }
        }
      }
    }
  }
  content {
    __typename
    ... on Issue {
      id
      number
      title
      bodyText
      state
      url
      createdAt
      updatedAt
      closedAt
      labels(first: 10) {
        nodes {
          name
          color
        }
      }
      comments(first: 100) {
        totalCount
        nodes {
          author {
            login
          }
          bodyText
        }
      }
    }
  }
}
