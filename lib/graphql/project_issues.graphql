query ProjectAssignedItemsPage($projectId: ID!, $after: String) {
  node(id: $projectId) {
    ... on ProjectV2 {
      items(first: 100, after: $after, query: "assignee:@me") {
        nodes {
          ...ProjectItemFields
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
  rateLimit {
    cost
    limit
    remaining
    resetAt
  }
}

fragment ProjectItemFields on ProjectV2Item {
  id
  fieldValues(first: 15) {
    nodes {
      __typename
      ... on ProjectV2ItemFieldSingleSelectValue {
        optionId
        name
        field {
          ... on ProjectV2SingleSelectField {
            id
            name
          }
        }
      }
      ... on ProjectV2ItemFieldDateValue {
        date
        field {
          ... on ProjectV2Field {
            id
            name
          }
        }
      }
    }
  }
  content {
    __typename
    ... on Issue {
      id
      url
      number
      title
      body
      bodyHTML
      createdAt
      updatedAt
      state
      closedAt
      comments(first: 0) {
        totalCount
      }
    }
  }
}
