query IssueComments($id: ID!) {
  node(id: $id) {
    ... on Issue {
      id
      comments(first: 100) {
        nodes {
          id
          createdAt
          author {
            login
          }
          body
          bodyHTML
          isMinimized
          minimizedReason
          viewerCanDelete
          viewerCanMinimize
          viewerCanUnminimize
          viewerCanUpdate
        }
      }
    }
  }
  rateLimit {
    cost
    limit
    remaining
    resetAt
  }
}
