query IssueComments($id: ID!) {
  node(id: $id) {
    ... on Issue {
      id
      comments(first: 100) {
        nodes {
          id
          createdAt
          author {
            login
          }
          bodyText
        }
      }
    }
  }
  rateLimit {
    cost
    limit
    remaining
    resetAt
  }
}
