query OwnerProjects($ownerId: ID!) {
  node(id: $ownerId) {
    ... on Organization {
      projectsV2(first: 100, orderBy: { field: TITLE, direction: ASC }) {
        nodes {
          id
          title
          shortDescription
          closed
        }
      }
    }
    ... on User {
      projectsV2(first: 100, orderBy: { field: TITLE, direction: ASC }) {
        nodes {
          id
          title
          shortDescription
          closed
        }
      }
    }
  }
}
