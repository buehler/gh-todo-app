mutation CreateIssue(
  $repositoryId: ID!
  $title: String!
  $body: String
  $assigneeIds: [ID!]
) {
  createIssue(
    input: {
      repositoryId: $repositoryId
      title: $title
      body: $body
      assigneeIds: $assigneeIds
    }
  ) {
    issue {
      id
      number
      title
      createdAt
      updatedAt
    }
  }
}
