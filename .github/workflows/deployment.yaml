name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  linux-build:
    name: Build Release Linux AppImage
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/linuxbuild.yaml
    with:
      checkout-ref: ${{ needs.release-please.outputs.tag_name }}

  linux-release:
    name: Publish Release Linux AppImage
    needs: [release-please, linux-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download x64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: gh-todos-linux-x86_64
          path: dist

      - name: Attach x64 AppImage to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/gh_todos-linux-x86_64.AppImage --clobber

  flutter-web:
    name: Release Flutter Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true
      - name: Install vercel
        run: npm install -g vercel
      - name: Install dependencies
        run: flutter pub get
      - name: Run build runner
        run: dart run build_runner build
      - name: Build Flutter Web
        run: flutter build web --release --build-number=${{ github.run_number }}
      - name: Copy additional resources
        run: |
          cp vercel.json build/web/vercel.json
          cp assets/legal/* build/web/
      - name: Deploy to Vercel
        run: vercel deploy --prod
        working-directory: build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
