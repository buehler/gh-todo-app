name: Linux Build

on:
  push:
    branches:
      - feat/linux-build

permissions:
  contents: read

env:
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build-x64:
    name: Build Linux x64 AppImage
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev locate wget
          sudo updatedb

      - name: Enable Linux build
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build generated code
        run: dart run build_runner build

      - name: Install Fastforge
        run: |
          dart pub global activate fastforge
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"

      - name: Install x64 appimagetool
        run: |
          wget -O "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"

          sudo install -m 755 "$RUNNER_TEMP/appimagetool" \
            /usr/local/bin/appimagetool

      - name: Build and package x64 AppImage
        run: |
          fastforge package \
            --platform linux \
            --targets appimage \
            --skip-clean

          while IFS= read -r -d '' artifact; do
            mv -- "$artifact" "${artifact%.AppImage}-x86_64.AppImage"
          done < <(find dist -type f -name '*.AppImage' -print0)

      - name: Upload x64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gh-todos-linux-x86_64
          path: dist/**/*-x86_64.AppImage
          if-no-files-found: error

  build-arm64:
    name: Build Linux ARM64 AppImage
    runs-on: ubuntu-22.04-arm

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip xz-utils wget \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev locate
          sudo updatedb

      - name: Setup native ARM64 Flutter SDK
        run: |
          git clone --depth 1 --branch stable \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"

          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

          # Flutter bootstraps the Dart SDK for the native architecture.
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/flutter" config \
            --enable-linux-desktop --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --linux

      - name: Install dependencies
        run: flutter pub get

      - name: Build generated code
        run: dart run build_runner build

      - name: Install Fastforge
        run: |
          dart pub global activate fastforge
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"

      - name: Install ARM64 appimagetool and Fastforge workaround
        run: |
          wget -O "$RUNNER_TEMP/appimagetool-aarch64.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage"

          sudo install -D -m 755 \
            "$RUNNER_TEMP/appimagetool-aarch64.AppImage" \
            /usr/local/lib/gh-todos/appimagetool-aarch64.AppImage

          # Fastforge passes ARCH=x86_64. Reset it inside the wrapper.
          cat > "$RUNNER_TEMP/appimagetool" <<'EOF'
          #!/usr/bin/env bash
          export ARCH=aarch64
          export APPIMAGE_EXTRACT_AND_RUN=1
          exec /usr/local/lib/gh-todos/appimagetool-aarch64.AppImage "$@"
          EOF

          sudo install -m 755 "$RUNNER_TEMP/appimagetool" \
            /usr/local/bin/appimagetool

      - name: Build and package ARM64 AppImage
        run: |
          fastforge package \
            --platform linux \
            --targets appimage \
            --skip-clean

          while IFS= read -r -d '' artifact; do
            mv -- "$artifact" "${artifact%.AppImage}-aarch64.AppImage"
          done < <(find dist -type f -name '*.AppImage' -print0)

      - name: Upload ARM64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gh-todos-linux-aarch64
          path: dist/**/*-aarch64.AppImage
          if-no-files-found: error
        